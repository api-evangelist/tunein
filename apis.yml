apis:
- name: TuneIn Platform API
  description: >-
    The TuneIn Platform API is a partner-facing REST API (OAuth 2.0) for embedding TuneIn's full audio
    service into third-party devices and ecosystems. It exposes endpoints for categories, user profiles,
    content libraries, media access, now-playing, favorites, search, recommendations, and reporting. Access
    requires a partner evaluation agreement and certification process.
